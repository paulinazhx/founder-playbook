name: external-links

on:
  schedule:
    # 07:00 UTC on the first of each month. Citations rot slowly, so a monthly
    # check is the right cadence; a per-deploy check would block shipping on
    # other people's servers.
    - cron: '0 7 1 * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:links:external
